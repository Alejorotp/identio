spring.application.name=mvp

# PostgreSQL Configuration (defaults for local run, overridden by docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:identio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:identio_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Debug Logging
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG

spring.docker.compose.file=./spring-compose.yaml