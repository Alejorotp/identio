spring.application.name=mvp
server.forward-headers-strategy=framework

# PostgreSQL Configuration (defaults for local run, overridden by docker-compose)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:identio_db}
spring.datasource.username=${PGUSER:identio_user}
spring.datasource.password=${PGPASSWORD:identio_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=30000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Debug Logging
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG

# RSA Keys for JWT
rsa.private-key=${RSA_PRIVATE_KEY:classpath:certs/private.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:certs/public.pem}

spring.docker.compose.file=./spring-compose.yaml
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}