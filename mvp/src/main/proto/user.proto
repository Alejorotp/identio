syntax = "proto3";

package identio.user;

option java_multiple_files = true;
option java_package = "com.identio.mvp.interfaces.user.grpc.user";
option java_outer_classname = "UserProto";

service UserService {
  rpc GetAllUsers (GetAllUsersRequest) returns (GetAllUsersResponse);
  rpc GetUserById (GetUserByIdRequest) returns (UserResponse);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc UpdateUserStatus (UpdateUserStatusRequest) returns (UserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

message GetAllUsersRequest {
  int32 page = 1;
  int32 size = 2;
}

message GetAllUsersResponse {
  repeated UserResponse users = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
}

message GetUserByIdRequest {
  string id = 1;
}

message CreateUserRequest {
  string full_name = 1;
  string email = 2;
  string password = 3;
  repeated string roles = 4;
}

message UpdateUserRequest {
  string id = 1;
  string full_name = 2;
  string password = 3;
  repeated string roles = 4;
}

message UpdateUserStatusRequest {
  string id = 1;
  string status = 2;
}

message DeleteUserRequest {
  string id = 1;
  string status = 2; // "BLOCKED" or "DELETED"
}

message DeleteUserResponse {
  bool success = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string status = 4;
  repeated string roles = 5;
}
