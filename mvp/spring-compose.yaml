services:
  postgres:
    image: postgres:16-alpine
    container_name: identio-postgres
    environment:
      POSTGRES_USER: identio_user
      POSTGRES_PASSWORD: identio_password
      POSTGRES_DB: identio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U identio_user -d identio_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: identio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: identio_mq_user
      RABBITMQ_DEFAULT_PASS: identio_mq_password
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
